<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planos e pagamentos | Rota Financeira</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#10151b;color:#f4f6f7;font-family:system-ui,sans-serif;margin:0}main{max-width:1060px;margin:48px auto;padding:0 22px}a{color:#d9ba79}h1{font-size:clamp(1.8rem,4vw,2.7rem)}.muted{color:#a8b5bf}.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:24px 0}.plan{padding:26px;border:1px solid #38434a;border-radius:14px;background:#1d252d}.plan strong{font-size:1.8rem;color:#e6c78b}.plan button{cursor:pointer;background:#d9b676;color:#141a1e;font:inherit;font-weight:700;padding:12px 18px;width:100%;border:0;border-radius:8px;margin-top:22px}.plan button:disabled{opacity:.55;cursor:wait}#notice{min-height:2em}
</style></head><body><main><a href="/servicos.html">← Voltar aos serviços</a><h1>Planos e serviços</h1><p class="muted">Pague com segurança pela InfinitePay. Para planos mensais, a renovação é feita por um novo pagamento: não há débito automático.</p><div id="currentStatus" role="status" style="background:#1d252d;border:1px solid #38434a;border-radius:12px;padding:14px 18px"></div><div id="plans" class="plans" aria-live="polite"></div><p id="notice" role="status"></p></main><script>
const plans=document.querySelector('#plans'),notice=document.querySelector('#notice');
const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/billing/catalog',{credentials:'same-origin'});if(r.status===401){location.href='/login.html';return}const data=await r.json();if(!r.ok)throw Error(data.error);const st=await fetch('/api/billing/status',{credentials:'same-origin'}).then(r=>r.ok?r.json():{}).catch(()=>({}));const current=document.getElementById('currentStatus');current.textContent=st.status==='pagante'?'Seu acesso está ativo.':st.status==='trial'||st.status==='free'?`Período gratuito: ${st.daysRemaining||0} dia(s) restante(s).`:st.core_blocked?'Seu acesso às ferramentas da plataforma está vencido. Serviços avulsos contratados permanecem disponíveis.':'Selecione o serviço que deseja contratar.';const serviceNames={plataforma:'Plataforma',planejamento:'Planejamento financeiro','divisao-casa':'Divisão de despesas da casa',consultoria:'Consultoria',acompanhamento:'Acompanhamento financeiro'};plans.innerHTML=data.plans.map(p=>`<article class="plan"><h2>${esc(p.name)}</h2><strong>${brl.format(p.price_cents/100)}</strong><p class="muted">${p.monthly?'Acesso por 30 dias • renovação por novo pagamento':'Pagamento único'}</p><p class="muted">Inclui: ${(p.services||[]).map(code=>esc(serviceNames[code]||code)).join(', ')}${!p.monthly?' · 1 crédito por pagamento':''}.</p><button data-plan="${esc(p.code)}">Contratar</button></article>`).join('');}catch(e){notice.textContent=e.message||'Erro ao consultar planos.'}}
plans.addEventListener('click',async e=>{const button=e.target.closest('[data-plan]');if(!button)return;button.disabled=true;notice.textContent='Gerando checkout seguro…';try{const r=await fetch('/api/billing/checkout',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({plan:button.dataset.plan})});const data=await r.json();if(!r.ok)throw Error(data.error||'Falha ao gerar pagamento');location.assign(data.checkout_url);}catch(err){notice.textContent=err.message;button.disabled=false}});load();
</script></body></html>
